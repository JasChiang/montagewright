<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>montagewright</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #fff;
    --sunken: #faf9f7;
    --ink: #1c1b19;
    --ink-soft: #55534e;
    --dim: #8b8880;
    --line: #e6e3dd;
    --line-soft: #f0eeE9;
    --accent: #b3452a;
    --accent-soft: #fdf2ee;
    --ok: #2c6a4c;
    --shadow: 0 1px 2px rgba(28,27,25,.04), 0 8px 24px -12px rgba(28,27,25,.10);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14140f;
      --surface: #1c1c18;
      --sunken: #191915;
      --ink: #efece4;
      --ink-soft: #b6b2a8;
      --dim: #8a867c;
      --line: #2e2d27;
      --line-soft: #26251f;
      --accent: #e08b6e;
      --accent-soft: #2a1f19;
      --ok: #7cc09b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 var(--sans);
  }
  ::selection { background: var(--accent-soft); }

  header {
    padding: 30px 32px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header .inner {
    max-width: 1060px; margin: 0 auto;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 17px; font-weight: 620;
    letter-spacing: -.01em;
  }
  h1 .dot { color: var(--accent); }
  header p { margin: 0; color: var(--dim); font-size: 13.5px; }

  main { max-width: 1060px; margin: 0 auto; padding: 28px 32px 100px; }

  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  h2 {
    margin: 0 0 3px; font-size: 14.5px; font-weight: 620;
    letter-spacing: -.005em;
  }
  h2 + .sub { margin: 0 0 20px; color: var(--dim); font-size: 13px; }

  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px 20px;
  }
  .field { min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label {
    display: block; font-size: 12.5px; font-weight: 550;
    color: var(--ink-soft); margin-bottom: 7px; letter-spacing: .01em;
  }
  input[type=text], input[type=number], input[type=file], select, textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--sunken); color: var(--ink);
    font: inherit; font-size: 14px;
    transition: border-color .15s, background .15s;
  }
  input[type=text]::placeholder, textarea::placeholder { color: var(--dim); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    background: var(--surface);
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.6; }
  select { cursor: pointer; }

  button {
    padding: 10px 18px; border: 1px solid transparent; border-radius: 9px;
    cursor: pointer; background: var(--accent); color: #fff;
    font: inherit; font-size: 14px; font-weight: 580;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(.5px); }
  button.ghost {
    background: transparent; color: var(--ink-soft);
    border-color: var(--line);
  }
  button.ghost:hover { background: var(--sunken); filter: none; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  button.big { padding: 12px 26px; font-size: 14.5px; border-radius: 10px; }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .actions {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line-soft);
  }
  .check {
    display: inline-flex; gap: 8px; align-items: center;
    font-size: 13.5px; color: var(--ink-soft); cursor: pointer;
    margin: 0;
  }
  .check input { width: auto; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 8px; }
  .hint a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .hint a:hover { color: var(--accent); border-color: currentColor; }

  /* folder picker */
  .picker {
    margin-top: 12px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--sunken); overflow: hidden;
  }
  .picker .crumb {
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    background: var(--surface); overflow-x: auto; white-space: nowrap;
  }
  .picker .listing { max-height: 260px; overflow: auto; padding: 6px; }
  .pick {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 7px; cursor: pointer;
    font-size: 13.5px; transition: background .1s;
  }
  .pick:hover { background: var(--accent-soft); }
  .pick .ico { color: var(--dim); flex: none; width: 16px; }
  .pick .count { margin-left: auto; color: var(--dim); font-size: 12px; }
  .pick.file { cursor: default; color: var(--ink-soft); }
  .pick.file:hover { background: transparent; }
  .picker .foot {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 14px; border-top: 1px solid var(--line);
    background: var(--surface);
  }

  /* progress */
  #log {
    font-family: var(--mono); font-size: 12px; line-height: 1.85;
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px;
    max-height: 320px; overflow: auto; white-space: pre-wrap;
    color: var(--ink-soft);
  }
  #log .stage { color: var(--ink); font-weight: 600; }
  #log .bad { color: var(--accent); }
  #log .good { color: var(--ok); font-weight: 600; }
  #log .faint { color: var(--dim); }
  .state { font-size: 14px; font-weight: 600; display: flex; gap: 9px; align-items: center; }
  .state::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); flex: none;
  }
  .state.done::before { background: var(--ok); }

  /* results */
  .stats {
    display: flex; gap: 34px; flex-wrap: wrap;
    padding-bottom: 22px; margin-bottom: 22px;
    border-bottom: 1px solid var(--line-soft);
  }
  .stat b {
    display: block; font-size: 24px; font-weight: 640;
    letter-spacing: -.02em; line-height: 1.25;
  }
  .stat span { font-size: 12px; color: var(--dim); }
  .delivery { display: flex; gap: 30px; flex-wrap: wrap; align-items: flex-start; }
  video {
    width: 296px; border-radius: 12px; background: #000;
    box-shadow: var(--shadow); display: block;
  }
  .downloads { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
  a.link {
    color: var(--ink-soft); font-size: 13px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  a.link::before { content: '↓'; color: var(--dim); }
  a.link:hover { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; padding: 0 12px 9px; font-size: 11.5px;
    color: var(--dim); font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; border-bottom: 1px solid var(--line);
  }
  td {
    text-align: left; padding: 11px 12px; vertical-align: top;
    border-bottom: 1px solid var(--line-soft);
  }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover, table tr:hover { background: var(--sunken); }
  td.mono, .mono { font-family: var(--mono); font-size: 12px; }
  td.num { white-space: nowrap; color: var(--ink-soft); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 550; border: 1px solid var(--line);
    color: var(--dim); white-space: nowrap;
  }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .tag.no { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
  .why { color: var(--dim); font-size: 12.5px; line-height: 1.55; }
  .scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .hide { display: none !important; }
  a.shot { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  a.shot:hover { color: var(--accent); border-color: currentColor; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>montagewright<span class="dot">.</span></h1>
    <p>丟一個資料夾進來，看它怎麼剪，以及為什麼</p>
  </div>
</header>

<main>
  <section id="setup">
    <div class="fields">
      <div class="field wide">
        <label>素材</label>
        <div class="row" style="gap:8px;flex-wrap:nowrap">
          <input type="text" id="path" placeholder="點「瀏覽」選一個資料夾，或直接貼路徑">
          <button type="button" class="ghost" id="browse" style="white-space:nowrap">瀏覽…</button>
        </div>
        <div class="picker hide" id="picker">
          <div class="crumb" id="crumb"></div>
          <div class="listing" id="listing"></div>
          <div class="foot">
            <button type="button" id="use-here">用這個資料夾</button>
            <button type="button" class="ghost" id="close-picker">關閉</button>
            <span class="why" id="picker-note"></span>
          </div>
        </div>
        <div class="hint">
          本機素材用路徑就好——上傳等於把硬碟上的檔案搬進瀏覽器再寫回去。
          <a href="#" id="show-upload">還是要用上傳</a>
        </div>
      </div>

      <div class="field wide hide" id="upload-row">
        <label>上傳素材資料夾</label>
        <input type="file" id="rushes" webkitdirectory directory multiple>
      </div>

      <div class="field">
        <label>音樂路徑</label>
        <input type="text" id="music-path" placeholder="留空＝不配樂">
      </div>
      <div class="field">
        <label>輸出比例</label>
        <select id="aspect">
          <option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option>
        </select>
      </div>
      <div class="field">
        <label>語音</label>
        <select id="speech">
          <option value="auto">自動判斷</option>
          <option value="never">不要轉錄</option>
        </select>
      </div>
      <div class="field">
        <label>語言</label>
        <input type="text" id="locale" value="zh-TW">
      </div>
      <div class="field">
        <label>可編輯時間軸</label>
        <select id="timeline">
          <option value="none">不需要</option>
          <option value="premiere">Premiere／Resolve</option>
          <option value="finalcut">Final Cut</option>
          <option value="both">兩種都要</option>
        </select>
      </div>
      <div class="field">
        <label>預算上限（美元）</label>
        <input type="number" id="budget" value="6" min="0.5" step="0.5">
      </div>

      <div class="field wide">
        <label>Brief（可留空）</label>
        <textarea id="brief" placeholder="這支片要傳達什麼、給誰看、非講不可的是什麼"></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="go" class="big">開始剪</button>
      <label class="check">
        <input type="checkbox" id="review" checked> 開啟自審與重新規劃
      </label>
      <span id="picked" class="why"></span>
    </div>
  </section>

  <section class="hide" id="past">
    <h2>先前的剪輯</h2>
    <p class="sub">點開可以跟這一輪比較。重開服務也還在。</p>
    <div class="scroll"><table id="past-table"></table></div>
  </section>

  <section class="hide" id="progress">
    <div class="row" style="justify-content:space-between;margin-bottom:16px">
      <span class="state" id="state">執行中</span>
      <button class="ghost" id="stop">停止</button>
    </div>
    <div id="log"></div>
  </section>

  <section class="hide" id="result">
    <div class="stats" id="stats"></div>
    <div class="delivery">
      <div>
        <video id="video" controls playsinline></video>
        <div class="downloads">
          <a id="download" class="link" download>完整畫質</a>
          <a id="subs" class="link hide" download>字幕 SRT</a>
          <a id="tl-pr" class="link hide" download>Premiere XML</a>
          <a id="tl-fc" class="link hide" download>Final Cut XML</a>
        </div>
      </div>
      <div style="flex:1;min-width:280px">
        <table id="spend"></table>
      </div>
    </div>
  </section>

  <section class="hide" id="shots">
    <h2>每一顆用了什麼、怎麼處理</h2>
    <p class="sub">點檔名可以單獨看那一顆——構圖問題在成片裡會被下一顆蓋過去。</p>
    <div class="scroll"><table id="shot-table"></table></div>
  </section>

  <section class="hide" id="transcripts">
    <h2>聽到了什麼</h2>
    <p class="sub">辨識器聽的、Gemini 改的、誰講的。轉錯的地方會讓後面每個決定都跟著錯。</p>
    <div class="scroll"><table id="tx-table"></table></div>
  </section>

  <section class="hide" id="aside">
    <h2>沒有用的素材</h2>
    <p class="sub">卡片判定不能用的，以及它給的理由。</p>
    <div class="scroll"><table id="aside-table"></table></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let runId = null, seen = 0, timer = null;

let picking = '';

async function browseTo(path) {
  const res = await fetch('/api/browse?path=' + encodeURIComponent(path || ''));
  if (!res.ok) { $('picker-note').textContent = '打不開'; return; }
  const d = await res.json();
  picking = d.here;
  $('crumb').textContent = d.here;
  const rows = [];
  if (d.parent) rows.push(`<div class="pick" data-path="${esc(d.parent)}">
    <span class="ico">↰</span><span class="why">上一層</span></div>`);
  for (const f of d.folders) {
    rows.push(`<div class="pick" data-path="${esc(f.path)}">
      <span class="ico">▸</span>${esc(f.name)}` +
      (f.clips ? `<span class="count">${f.clips} 支</span>` : '') + `</div>`);
  }
  for (const v of d.videos) {
    rows.push(`<div class="pick file"><span class="ico">·</span>${esc(v.name)}</div>`);
  }
  $('listing').innerHTML = rows.join('') ||
    '<div class="pick file"><span class="ico">·</span>這裡沒有東西</div>';
  $('picker-note').textContent = d.videos.length
    ? `這層有 ${d.videos.length} 支影片` : '這層沒有影片，往下點';
  for (const el of $('listing').querySelectorAll('.pick[data-path]')) {
    el.onclick = () => browseTo(el.dataset.path);
  }
}

$('browse').addEventListener('click', () => {
  $('picker').classList.remove('hide');
  browseTo($('path').value.trim());
});
$('close-picker').addEventListener('click', () => $('picker').classList.add('hide'));
$('use-here').addEventListener('click', () => {
  $('path').value = picking;
  $('picker').classList.add('hide');
});

$('show-upload').addEventListener('click', (e) => {
  e.preventDefault(); $('upload-row').classList.remove('hide');
});

async function loadPast() {
  const data = await (await fetch('/api/runs?limit=20')).json();
  if (!data.runs.length) return;
  $('past-table').innerHTML =
    '<tr><th>時間</th><th>素材</th><th>片長</th><th>顆數</th><th>逐顆通過</th><th>花費</th><th></th></tr>' +
    data.runs.map(r => `<tr>
      <td class="mono">${new Date(r.started_at * 1000).toLocaleString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      <td class="mono">${esc(r.source)}</td>
      <td class="mono">${r.seconds ? r.seconds.toFixed(1) + 's' : '—'}</td>
      <td class="mono">${r.shots || '—'}</td>
      <td class="mono">${r.delivered != null ? r.delivered + '/' + r.shots : '—'}</td>
      <td class="mono">${r.spend != null ? '$' + r.spend.toFixed(2) : '—'}</td>
      <td><a class="shot" href="#" onclick="openRun('${r.run_id}');return false">打開</a></td>
    </tr>`).join('');
  $('past').classList.remove('hide');
}

async function openRun(id) {
  runId = id; seen = 0;
  const data = await (await fetch(`/api/runs/${id}`)).json();
  $('log').textContent = data.lines.join('\n');
  $('progress').classList.remove('hide');
  $('state').textContent = { running:'執行中', done:'完成', failed:'失敗', stopped:'已停止', interrupted:'中斷' }[data.state] || data.state;
  if (data.has_video) {
    $('video').src = `/api/runs/${id}/video`;
    $('download').href = `/api/runs/${id}/deliverable`;
    $('result').classList.remove('hide');
  }
  if (data.report) { render(data.report); showExtras(); }
  window.scrollTo({ top: $('progress').offsetTop - 20, behavior: 'smooth' });
}

async function showTranscripts() {
  const data = await (await fetch(`/api/runs/${runId}/transcripts`)).json();
  const rows = [];
  for (const [source, card] of Object.entries(data.sources)) {
    rows.push(`<tr><td colspan="4" style="padding-top:16px"><strong>${esc(source)}</strong>
      <span class="why">　${esc(card.language || '')}　${esc(card.summary)}</span></td></tr>`);
    for (const l of card.lines) rows.push(`<tr>
      <td class="mono">${l.starts_seconds.toFixed(1)}–${l.ends_seconds.toFixed(1)}s</td>
      <td class="why">${esc(l.speaker)}</td>
      <td>${esc(l.text)}</td>
      <td class="why">${l.corrected ? '聽成：' + esc(l.heard) : ''}</td></tr>`);
  }
  if (!rows.length) return;
  $('tx-table').innerHTML = '<tr><th>時間</th><th>誰</th><th>說了什麼</th><th>原始辨識</th></tr>' + rows.join('');
  $('transcripts').classList.remove('hide');
}

function showExtras() {
  for (const [id, flavour] of [['tl-pr','premiere'], ['tl-fc','finalcut']]) {
    fetch(`/api/runs/${runId}/timeline/${flavour}`, { method: 'HEAD' })
      .then(r => { if (r.ok) {
        $(id).href = `/api/runs/${runId}/timeline/${flavour}`;
        $(id).classList.remove('hide');
      }});
  }
  fetch(`/api/runs/${runId}/subtitles`, { method: 'HEAD' }).then(r => {
    if (r.ok) { $('subs').href = `/api/runs/${runId}/subtitles`; $('subs').classList.remove('hide'); }
  });
  showTranscripts();
}

loadPast();

$('rushes').addEventListener('change', () => {
  const files = [...$('rushes').files].filter(f => /\.(mp4|mov|m4v|avi|mkv)$/i.test(f.name));
  $('picked').textContent = files.length ? `${files.length} 支影片` : '沒有找到影片檔';
});

$('go').addEventListener('click', async () => {
  const files = [...$('rushes').files].filter(f => /\.(mp4|mov|m4v|avi|mkv)$/i.test(f.name));
  const path = $('path').value.trim();
  if (!path && !files.length) { alert('給一個素材路徑，或改用上傳'); return; }
  const body = new FormData();
  files.forEach(f => body.append('rushes', f, f.name));
  body.append('source_path', path);
  body.append('music_path', $('music-path').value.trim());
  body.append('speech', $('speech').value);
  body.append('locale', $('locale').value.trim());
  body.append('brief', $('brief').value);
  body.append('aspect', $('aspect').value);
  body.append('budget', $('budget').value);
  body.append('review', $('review').checked ? 'true' : 'false');
  body.append('timeline', $('timeline').value);

  $('go').disabled = true;
  $('progress').classList.remove('hide');
  $('log').textContent = '上傳中…\n';
  const res = await fetch('/api/runs', { method: 'POST', body });
  if (!res.ok) {
    $('log').textContent = '啟動失敗：' + (await res.text());
    $('go').disabled = false; return;
  }
  runId = (await res.json()).run_id;
  seen = 0; $('log').textContent = '';
  // Whatever is on screen belongs to the last run. Leaving it there while a
  // new one writes cards reads as though the new one already finished.
  for (const id of ['result', 'shots', 'transcripts', 'aside']) {
    $(id).classList.add('hide');
  }
  for (const id of ['subs', 'tl-pr', 'tl-fc']) $(id).classList.add('hide');
  $('video').removeAttribute('src');
  timer = setInterval(poll, 1200);
  poll();
});

$('stop').addEventListener('click', async () => {
  if (runId) await fetch(`/api/runs/${runId}/stop`, { method: 'POST' });
});

function classify(line) {
  if (/^\s+card \d+\//.test(line)) return 'faint';
  if (/error|Traceback|failed|refused/i.test(line)) return 'bad';
  if (/^(cards|direction|selection|shots|review|replan|cut on action|set aside|no music map)/.test(line)) return 'stage';
  if (/delivered what they planned/.test(line)) return 'good';
  return '';
}

async function poll() {
  const res = await fetch(`/api/runs/${runId}?since=${seen}`);
  const data = await res.json();
  for (const line of data.lines) {
    const span = document.createElement('span');
    span.className = classify(line);
    span.textContent = line + '\n';
    $('log').appendChild(span);
  }
  seen = data.total_lines;
  $('log').scrollTop = $('log').scrollHeight;
  $('state').textContent = { running: '執行中', done: '完成', failed: '失敗', stopped: '已停止' }[data.state];

  if (data.state !== 'running') {
    clearInterval(timer); $('go').disabled = false;
    if (data.has_video) {
      $('video').src = `/api/runs/${runId}/video`;
      $('download').href = `/api/runs/${runId}/deliverable`;
      showExtras();
      $('result').classList.remove('hide');
    }
    if (data.report) render(data.report);
    loadPast();
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function render(report) {
  const stats = [
    ['片長', `${(report.duration_seconds ?? 0).toFixed(1)}s`, `目標 ${report.target_seconds ?? '—'}s`],
    ['顆數', (report.selection?.shots || []).length, '鏡頭'],
    ['對上音樂', report.cuts_on_music ?? '—', '刀'],
    ['降級', (report.degradations || []).length, '筆，都有量測值'],
    ['花費', '$' + Object.values(report.spend?.by_stage || {}).reduce((a, b) => a + b, 0).toFixed(2), '本輪'],
  ];
  $('stats').innerHTML = stats.map(([k, v, s]) =>
    `<div class="stat"><b>${esc(String(v))}</b><span>${esc(k)}・${esc(s)}</span></div>`).join('');

  // The report nests these under by_stage alongside the cap and the running
  // total; iterating the outer object showed one row called "by_stage".
  const spend = Object.entries(report.spend?.by_stage || {})
    .sort((a, b) => b[1] - a[1]);
  const total = spend.reduce((a, [, v]) => a + v, 0);
  $('spend').innerHTML = '<tr><th>階段</th><th style="text-align:right">花費</th></tr>' +
    spend.map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td class="mono" style="text-align:right">$${v.toFixed(4)}</td></tr>`).join('') +
    `<tr><td class="why">合計</td><td class="mono" style="text-align:right">$${total.toFixed(4)}</td></tr>`;

  const shots = report.selection?.shots || [];
  const rhythm = report.rhythm || {}, verdicts = report.shots || {};
  const degByClip = {};
  for (const d of report.degradations || []) (degByClip[d.clip_id] ||= []).push(d);

  $('shot-table').innerHTML =
    '<colgroup><col style="width:34px"><col style="width:130px"><col style="width:104px">' +
    '<col style="width:88px"><col style="width:170px"><col><col style="width:150px">' +
    '<col style="width:170px"></colgroup>' +
    '<tr><th>#</th><th>素材</th><th>進點／長度</th><th>運鏡</th><th>主體／說話者</th>' +
    '<th>為什麼用這顆</th><th>降級</th><th>逐顆驗收</th></tr>' +
    shots.map((s, i) => {
      const k = 'k' + String(i).padStart(2, '0');
      const r = rhythm[k] || {}, v = verdicts[k] || {};
      const deg = (degByClip[k] || []).map(d =>
        `<div class="why">${esc(d.ladder)}${d.adjudication ? ` <span class="tag">${esc(d.adjudication)}</span>` : ''}</div>`).join('');
      const ok = v.delivered === undefined ? '' :
        `<span class="tag ${v.delivered ? 'ok' : 'no'}">${v.delivered ? '做到' : '沒做到'}</span>`;
      return `<tr>
        <td class="mono">${i}</td>
        <td class="mono" style="word-break:break-all"><a class="shot" href="/api/runs/${runId}/shot/${i}" target="_blank">${esc(s.source_id)}</a></td>
        <td class="mono num">${Number(s.start_seconds ?? 0).toFixed(1)}s<br>${Number(r.seconds ?? 0).toFixed(2)}s</td>
        <td>${esc(s.camera_move)}${s.framing ? `<div class="why">${esc(s.framing)}</div>` : ''}</td>
        <td>${esc(s.subject)}${s.must_be_whole ? '<div class="why">要完整</div>' : ''}${v.speaker ? `<div class="why">說話：${esc(v.speaker)}</div>` : ''}</td>
        <td class="why">${esc(s.why)}${r.why ? `<div style="margin-top:5px">節奏：${esc(r.why)}</div>` : ''}</td>
        <td>${deg || '<span class="why">—</span>'}</td>
        <td>${ok}${v.note ? `<div class="why">${esc(v.note)}</div>` : ''}</td>
      </tr>`;
    }).join('');
  $('shots').classList.remove('hide');

  const aside = Object.entries(report.set_aside || {});
  if (aside.length) {
    $('aside-table').innerHTML = '<tr><th>檔名</th><th>卡片說的理由</th></tr>' +
      aside.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="why">${esc(v)}</td></tr>`).join('');
    $('aside').classList.remove('hide');
  }
}
</script>
</body>
</html>
