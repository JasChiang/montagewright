<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>montagewright</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #fff; --sunk: #eceae5; --deep: #e2dfd8;
    --ink: #1a1917; --soft: #56534d; --dim: #8d8a82;
    --line: #dedbd4; --hair: #eae7e1;
    --accent: #b3452a; --wash: #fbf0ec; --ok: #2c6a4c;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    --rail: 58px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f0d; --panel: #191815; --sunk: #131210; --deep: #0d0c0a;
      --ink: #efece4; --soft: #b4b0a6; --dim: #86827a;
      --line: #2b2a24; --hair: #221f1b;
      --accent: #e08b6e; --wash: #271c17; --ok: #7cc09b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--wash); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-rows: var(--rail) 1fr auto; height: 100%; }

  /* toolbar */
  .bar {
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 14.5px; font-weight: 640; letter-spacing: -.01em; }
  .brand .dot { color: var(--accent); }
  .bar .sep { width: 1px; height: 22px; background: var(--line); }
  .bar .grow { flex: 1; }
  .crumbs { display: flex; gap: 9px; align-items: baseline; min-width: 0; }
  .crumbs .what { font-size: 13px; font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs .meta { font-size: 11.5px; color: var(--dim); white-space: nowrap; }

  /* middle: viewer + inspector */
  .stage {
    display: grid; grid-template-columns: 1fr minmax(320px, 27vw);
    min-height: 0; background: var(--sunk);
  }
  @media (max-width: 940px) { .stage { grid-template-columns: 1fr; } }
  .screen {
    display: grid; place-items: center; min-height: 0; min-width: 0;
    padding: 20px; position: relative; background: var(--deep);
    overflow: hidden;
  }
  /* The take is 16:9 and the cut is 9:16, so whichever is showing has to be
     the one that fits -- letting the wider one size the box pushed it over
     the reel. */
  .frame { position: relative; display: flex; min-width: 0; min-height: 0;
           max-width: 100%; max-height: 100%; }
  .screen video {
    max-width: 100%; max-height: 100%; width: auto; height: auto;
    border-radius: 6px; background: #000; display: block; object-fit: contain;
  }
  .cropbox {
    position: absolute; border: 1.5px solid var(--accent); border-radius: 2px;
    box-shadow: 0 0 0 9999px rgba(16,15,13,.55); pointer-events: none;
  }
  .cropbox::after {
    content: attr(data-say); position: absolute; left: 0; top: -19px;
    font-size: 10px; font-family: var(--mono); color: #fff;
    background: var(--accent); padding: 1px 5px; border-radius: 3px; white-space: nowrap;
  }
  .peek { position: absolute; left: 18px; bottom: 16px; display: flex; gap: 2px; }
  .peek button { font-size: 11.5px; border-radius: 6px; }
  .peek button.on { color: var(--ink); background: var(--panel); }
  .screen .over {
    position: absolute; left: 18px; top: 16px; display: flex; gap: 18px;
    font-size: 11.5px; color: var(--dim); pointer-events: none;
  }
  .screen .over b { color: var(--soft); font-weight: 600; }

  .side {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side .head {
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .side .head .who { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .side .body { overflow: auto; padding: 4px 16px 18px; flex: 1; min-height: 0; }
  .side:empty::after { content: ''; }

  dl.facts { margin: 0; }
  dl.facts dt {
    font-size: 10.5px; color: var(--dim); letter-spacing: .04em;
    text-transform: uppercase; margin-top: 15px;
  }
  dl.facts dd { margin: 3px 0 0; font-size: 13px; }
  dl.facts dd.why, .why { color: var(--soft); font-size: 12.5px; line-height: 1.6; }
  .nothing { color: var(--dim); font-size: 12.5px; padding: 22px 0; }

  /* reel */
  .reelwrap { background: var(--panel); border-top: 1px solid var(--line); }
  .reelbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    border-bottom: 1px solid var(--hair); font-size: 12px; color: var(--dim);
  }
  .reelbar .grow { flex: 1; }
  .zoom { display: flex; align-items: center; gap: 7px; }
  .zoom input[type=range] { width: 110px; accent-color: var(--accent); }
  .vol { display: flex; align-items: center; gap: 7px; }
  .vol input[type=range] { width: 78px; accent-color: var(--accent); }
  .scroller { overflow-x: auto; overflow-y: hidden; }
  .reel { position: relative; min-width: 100%; }
  .ruler {
    position: relative; height: 20px; background: var(--sunk);
    border-bottom: 1px solid var(--line); font-family: var(--mono);
    font-size: 9.5px; color: var(--dim);
  }
  .ruler span { position: absolute; top: 4px; transform: translateX(3px); }
  .ruler i { position: absolute; top: 10px; bottom: 0; width: 1px; background: var(--line); }
  .track { position: relative; height: 54px; background: var(--sunk); border-bottom: 1px solid var(--hair); }
  .blk {
    position: absolute; top: 3px; bottom: 3px; overflow: hidden; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    border-left: 2px solid color-mix(in srgb, var(--ok) 60%, transparent);
    border-radius: 4px; padding: 5px 7px; transition: background .1s;
  }
  .blk.no { border-left-color: var(--accent); background: var(--wash); }
  .blk:hover { background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
  .blk.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .blk .lab { font-size: 10.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .blk .dur { font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
  .blk .grip { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  .blk .grip.l { left: -1px } .blk .grip.r { right: -1px }
  .blk .grip:hover { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .blk .kill {
    position: absolute; top: 3px; right: 3px; width: 14px; height: 14px;
    border-radius: 3px; display: none; place-items: center; font-size: 10px;
    background: var(--panel); color: var(--accent); border: 1px solid var(--line);
  }
  .blk:hover .kill { display: grid; }
  .lane { position: relative; height: 34px; background: var(--sunk); border-bottom: 1px solid var(--hair); }
  .lane:last-of-type { border-bottom: 0; }
  .lane .name {
    position: absolute; left: 7px; top: 2px; z-index: 3; font-size: 9.5px;
    color: var(--dim); background: var(--sunk); padding: 0 4px; border-radius: 3px;
    pointer-events: none;
  }
  .lane img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
  .lane.silent { display: grid; place-items: center; font-size: 10.5px; color: var(--dim); }
  .playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); z-index: 6; cursor: ew-resize; }
  .playhead::before {
    content: ''; position: absolute; top: 0; left: -4px; width: 9px; height: 9px;
    background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .playhead::after { content: ''; position: absolute; top: 0; bottom: 0; left: -5px; width: 11px; }

  /* tabs drawer */
  .drawer { background: var(--panel); border-top: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; padding: 0 12px; align-items: stretch; }
  .tab {
    padding: 9px 13px; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 12.5px; color: var(--dim);
    border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--soft); }
  .tab.on { color: var(--ink); font-weight: 580; border-bottom-color: var(--accent); }
  .tabs .grow { flex: 1; }
  .panes { max-height: 40vh; overflow: auto; border-top: 1px solid var(--hair); }
  .panes.shut { display: none; }
  .pane { padding: 16px 18px 22px; }
  .pane .sub { margin: 0 0 14px; color: var(--dim); font-size: 12.5px; }

  /* modal */
  .veil {
    position: fixed; inset: 0; background: rgba(20,19,17,.4);
    display: grid; place-items: center; z-index: 40; padding: 22px;
    backdrop-filter: blur(2px);
  }
  .sheet {
    background: var(--panel); border-radius: 14px; width: min(880px, 100%);
    max-height: 90vh; overflow: auto; padding: 26px 28px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.4);
  }
  .sheet h2 { margin: 0 0 3px; font-size: 15px; }
  .sheet .sub { margin: 0 0 20px; color: var(--dim); font-size: 12.5px; }

  /* forms & bits */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 15px 16px; }
  .field.wide { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; font-weight: 550; color: var(--soft); margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=file], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--sunk); color: var(--ink); font: inherit; font-size: 13.5px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  textarea { min-height: 78px; resize: vertical; }
  button {
    padding: 8px 15px; border: 1px solid transparent; border-radius: 7px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-size: 13px; font-weight: 570;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--soft); border-color: var(--line); }
  button.ghost:hover { background: var(--sunk); filter: none; }
  button.bare { background: transparent; color: var(--dim); border: 0; padding: 5px 8px; }
  button.bare:hover { color: var(--ink); filter: none; }
  button:disabled { opacity: .4; cursor: not-allowed; filter: none; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: 13px; align-items: center; flex-wrap: wrap; margin-top: 20px; padding-top: 17px; border-top: 1px solid var(--hair); }
  .check { display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--soft); cursor: pointer; margin: 0; }
  .check input { width: auto; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .hint a { color: var(--soft); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 550; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .tag.no { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 0 10px 7px; font-size: 10.5px; color: var(--dim); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; vertical-align: top; border-bottom: 1px solid var(--hair); }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover, table tr:hover { background: var(--sunk); }
  td.mono, .mono { font-family: var(--mono); font-size: 11.5px; }
  .scroll { overflow-x: auto; }
  .hide { display: none !important; }
  a.link { color: var(--soft); font-size: 12.5px; text-decoration: none; display: inline-flex; gap: 5px; }
  a.link::before { content: '↓'; color: var(--dim); }
  a.link:hover { color: var(--accent); }
  a.shot { color: var(--soft); text-decoration: none; border-bottom: 1px solid var(--line); cursor: pointer; }
  a.shot:hover { color: var(--accent); }

  /* picker, progress, fault — unchanged in kind */
  .picker { margin-top: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--sunk); overflow: hidden; }
  .picker .crumb { padding: 9px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--dim); background: var(--panel); overflow-x: auto; white-space: nowrap; }
  .picker .listing { max-height: 230px; overflow: auto; padding: 5px; }
  .pick { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .pick:hover { background: var(--wash); }
  .pick .ico { color: var(--dim); flex: none; width: 14px; }
  .pick .count { margin-left: auto; color: var(--dim); font-size: 11.5px; }
  .pick.file { cursor: default; color: var(--soft); }
  .pick.file:hover { background: transparent; }
  .picker .foot { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #log { font-family: var(--mono); font-size: 11.5px; line-height: 1.8; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; max-height: 260px; overflow: auto; white-space: pre-wrap; color: var(--soft); }
  #log .stage { color: var(--ink); font-weight: 600; }
  #log .bad { color: var(--accent); }
  #log .good { color: var(--ok); font-weight: 600; }
  #log .faint { color: var(--dim); }
  .state { font-size: 13.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .state.done::before { background: var(--ok); }
  .steps { list-style: none; margin: 0 0 14px; padding: 0; }
  .steps li { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
  .steps li:last-child { border-bottom: 0; }
  .steps .mark { flex: none; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 9.5px; color: var(--dim); }
  .steps li.done .mark { border-color: var(--ok); color: var(--ok); }
  .steps li.now .mark, .steps li.broke .mark { border-color: var(--accent); color: var(--accent); }
  .steps li.broke .name { color: var(--accent); }
  .steps li.now .mark::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .steps .name { font-weight: 560; font-size: 13px; }
  .steps li.todo .name { color: var(--dim); font-weight: 470; }
  .steps .said { color: var(--soft); font-size: 12px; margin-top: 2px; }
  .steps li.todo .said { color: var(--dim); }
  details#raw summary { cursor: pointer; font-size: 12px; margin-bottom: 9px; list-style: none; }
  details#raw summary::before { content: '▸ '; }
  details#raw[open] summary::before { content: '▾ '; }
  .fault { margin: 0 0 15px; padding: 12px 14px; border-radius: 8px; background: var(--wash); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); font-size: 13px; }
  .fault b { display: block; margin-bottom: 4px; }
  .fault .detail { font-family: var(--mono); font-size: 11.5px; color: var(--soft); }
  .fault a { color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="brand">montagewright<span class="dot">.</span></span>
    <span class="sep"></span>
    <span class="crumbs">
      <span class="what" id="crumb-what">還沒有打開任何一輪</span>
      <span class="meta" id="crumb-meta"></span>
    </span>
    <span class="grow"></span>
    <span id="picked" class="meta"></span>
    <button class="ghost" id="open-past">先前的剪輯</button>
    <button id="new-run">新的一輪</button>
  </div>

  <div class="stage">
    <div class="screen">
      <div class="over" id="over"></div>
      <div class="frame" id="frame">
        <video id="video" playsinline></video>
        <video id="raw-video" playsinline controls preload="metadata" class="hide"></video>
        <div class="cropbox hide" id="cropbox"></div>
      </div>
      <div class="peek">
        <button class="bare on" id="see-cut">成片</button>
        <button class="bare" id="see-raw">原素材＋裁切框</button>
      </div>
    </div>
    <aside class="side">
      <div class="head" id="ins-head"><span class="who">這一顆</span></div>
      <div class="body" id="inspector"></div>
    </aside>
  </div>

  <div class="reelwrap">
    <div class="reelbar">
      <button class="bare" id="play">▶︎</button>
      <span class="mono" id="clock">0:00 / 0:00</span>
      <span class="vol">音量 <input type="range" id="vol" min="0" max="1" step="0.05" value="1"></span>
      <span class="grow" id="strip-note">拖邊緣改進出點，拖方塊換順序，× 刪掉</span>
      <span class="zoom">縮放 <input type="range" id="zoom" min="6" max="120" step="1" value="24"></span>
      <button class="ghost" id="fit">符合寬度</button>
      <button class="ghost" id="undo-cut">還原</button>
      <button id="recut" class="hide">重新輸出</button>
    </div>
    <div class="scroller" id="scroller">
      <div class="reel" id="reel">
        <div class="ruler" id="ruler"></div>
        <div class="track" id="track"></div>
        <div class="lane" id="lane-voice"><span class="name">人聲</span></div>
        <div class="lane" id="lane-music"><span class="name">音樂</span></div>
        <div class="playhead" id="playhead" style="left:0"></div>
      </div>
    </div>
  </div>

  <div class="drawer">
    <div class="tabs">
      <button class="tab on" data-pane="pane-shots">全部鏡頭</button>
      <button class="tab" data-pane="pane-tx">聽到了什麼</button>
      <button class="tab" data-pane="pane-spend">花費</button>
      <button class="tab" data-pane="pane-aside">沒用的素材</button>
      <button class="tab" data-pane="pane-past">先前的剪輯</button>
      <span class="grow"></span>
      <button class="bare" id="fold">收起</button>
    </div>
    <div class="panes" id="panes">
      <div class="pane" id="pane-shots">
        <p class="sub">點一列會選到時間軸上那一顆；點檔名單獨看它。</p>
        <div class="scroll"><table id="shot-table"></table></div>
      </div>
      <div class="pane hide" id="pane-tx">
        <p class="sub">辨識器聽的、Gemini 改的、誰講的。轉錯的地方會讓後面每個決定都跟著錯。</p>
        <div class="scroll"><table id="tx-table"></table></div>
      </div>
      <div class="pane hide" id="pane-spend">
        <div class="scroll" style="max-width:520px"><table id="spend"></table></div>
      </div>
      <div class="pane hide" id="pane-aside">
        <p class="sub">沒有進到成片的素材，以及是在哪一步被放下的。</p>
        <div class="scroll"><table id="aside-table"></table></div>
      </div>
      <div class="pane hide" id="pane-past">
        <p class="sub">照素材分組。點開可以跟這一輪比較。</p>
        <div class="scroll"><table id="past-table"></table></div>
      </div>
    </div>
  </div>
</div>

<div class="veil hide" id="veil">
  <div class="sheet" id="sheet">
    <div id="setup">
      <h2>新的一輪</h2>
      <p class="sub">指到素材，其餘留空也能跑。</p>
      <div class="fields">
        <div class="field wide">
          <label>素材</label>
          <div class="row" style="gap:8px;flex-wrap:nowrap">
            <input type="text" id="path" placeholder="點「瀏覽」選一個資料夾，或直接貼路徑">
            <button type="button" class="ghost" id="browse" style="white-space:nowrap">瀏覽…</button>
          </div>
          <div class="picker hide" id="picker">
            <div class="crumb" id="crumb"></div>
            <div class="listing" id="listing"></div>
            <div class="foot">
              <button type="button" id="use-here">用這個資料夾</button>
              <button type="button" class="ghost" id="close-picker">關閉</button>
              <span class="why" id="picker-note"></span>
            </div>
          </div>
          <div class="hint">本機素材用路徑就好——上傳等於把硬碟上的檔案搬進瀏覽器再寫回去。
            <a href="#" id="show-upload">還是要用上傳</a></div>
        </div>
        <div class="field wide hide" id="upload-row">
          <label>上傳素材資料夾</label>
          <input type="file" id="rushes" webkitdirectory directory multiple>
        </div>
        <div class="field">
          <label>音樂</label>
          <div class="row" style="gap:8px;flex-wrap:nowrap">
            <input type="text" id="music-path" placeholder="留空＝不配樂">
            <button type="button" class="ghost" id="browse-music" style="white-space:nowrap">瀏覽…</button>
          </div>
        </div>
        <div class="field"><label>輸出比例</label>
          <select id="aspect"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:5</option></select></div>
        <div class="field"><label>語音</label>
          <select id="speech"><option value="auto">自動判斷</option><option value="never">不要轉錄</option></select></div>
        <div class="field"><label>語言</label><input type="text" id="locale" value="zh-TW"></div>
        <div class="field"><label>可編輯時間軸</label>
          <select id="timeline">
            <option value="none">事後再產也行</option>
            <option value="premiere">Premiere／Resolve</option>
            <option value="finalcut">Final Cut</option>
            <option value="both">兩種都要</option>
          </select></div>
        <div class="field"><label>預算上限（美元）</label>
          <input type="number" id="budget" value="6" min="0.5" step="0.5"></div>
        <div class="field wide"><label>Brief（可留空）</label>
          <textarea id="brief" placeholder="這支片要傳達什麼、給誰看、非講不可的是什麼"></textarea></div>
      </div>
      <div class="actions">
        <button id="go">開始剪</button>
        <label class="check"><input type="checkbox" id="review" checked> 開啟自審與重新規劃</label>
        <span class="grow"></span>
        <button class="ghost" id="close-sheet">關閉</button>
      </div>
    </div>

    <div id="progress" class="hide" style="margin-top:26px">
      <div class="row" style="justify-content:space-between;margin-bottom:13px">
        <span class="state" id="state">執行中</span>
        <span class="row" style="gap:8px">
          <button id="resume" class="hide">繼續跑</button>
          <button class="ghost" id="stop">停止</button>
        </span>
      </div>
      <div class="fault hide" id="fault"></div>
      <ol class="steps" id="steps"></ol>
      <details id="raw"><summary class="why">原始輸出</summary><div id="log"></div></details>
    </div>
  </div>
</div>

<div class="hide" id="result"></div>
<div class="hide" id="detail"></div>
<div class="hide" id="strip"></div>
<a class="hide" id="download"></a><a class="hide" id="subs"></a>
<a class="hide" id="tl-pr"></a><a class="hide" id="tl-fc"></a>
<div class="hide" id="stats"></div>

<script>


const $ = (id) => document.getElementById(id);
let runId = null, seen = 0, timer = null, ticker = null, allLines = [];

let picking = '', pickTarget = 'path', pickKind = 'video';

async function browseTo(path) {
  const res = await fetch('/api/browse?path=' + encodeURIComponent(path || '')
    + '&kind=' + pickKind);
  if (!res.ok) { $('picker-note').textContent = '打不開'; return; }
  const d = await res.json();
  picking = d.here;
  $('crumb').textContent = d.here;
  const rows = [];
  if (d.parent) rows.push(`<div class="pick" data-path="${esc(d.parent)}">
    <span class="ico">↰</span><span class="why">上一層</span></div>`);
  for (const f of d.folders) {
    rows.push(`<div class="pick" data-path="${esc(f.path)}">
      <span class="ico">▸</span>${esc(f.name)}` +
      (f.clips ? `<span class="count">${f.clips} 支</span>` : '') + `</div>`);
  }
  for (const v of d.videos) {
    rows.push(pickKind === 'audio'
      ? `<div class="pick" data-file="${esc(v.path)}"><span class="ico">♪</span>${esc(v.name)}</div>`
      : `<div class="pick file"><span class="ico">·</span>${esc(v.name)}</div>`);
  }
  $('listing').innerHTML = rows.join('') ||
    '<div class="pick file"><span class="ico">·</span>這裡沒有東西</div>';
  $('picker-note').textContent = d.videos.length
    ? (pickKind === 'audio' ? `點一個檔案選它` : `這層有 ${d.videos.length} 支影片`)
    : (pickKind === 'audio' ? '這層沒有音檔，往下點' : '這層沒有影片，往下點');
  for (const el of $('listing').querySelectorAll('.pick[data-path]')) {
    el.onclick = () => browseTo(el.dataset.path);
  }
  for (const el of $('listing').querySelectorAll('.pick[data-file]')) {
    el.onclick = () => {
      $(pickTarget).value = el.dataset.file;
      $('picker').classList.add('hide');
    };
  }
}

function openPicker(target, kind) {
  pickTarget = target; pickKind = kind;
  $('use-here').style.display = kind === 'audio' ? 'none' : '';
  $('picker').classList.remove('hide');
  browseTo($(target).value.trim());
}
$('browse').addEventListener('click', () => openPicker('path', 'video'));
$('browse-music').addEventListener('click', () => openPicker('music-path', 'audio'));
$('close-picker').addEventListener('click', () => $('picker').classList.add('hide'));
$('use-here').addEventListener('click', () => {
  $(pickTarget).value = picking;
  $('picker').classList.add('hide');
});

$('show-upload').addEventListener('click', (e) => {
  e.preventDefault(); $('upload-row').classList.remove('hide');
});

async function loadPast() {
  const data = await (await fetch('/api/runs?limit=40')).json();
  if (!data.runs.length) {
    $('past-table').innerHTML = emptyRow(7, '還沒有跑過任何一輪。');
    $('detail').classList.remove('hide');
    showTab('pane-past');
    return;
  }
  // Grouped by the material, because that is the unit of this work: one
  // folder of rushes, several cuts out of it. It is also the unit the cards
  // are cached by, so runs in the same group are the cheap ones.
  const bySource = new Map();
  for (const r of data.runs) {
    const key = r.source_path || r.source || '（未知）';
    if (!bySource.has(key)) bySource.set(key, []);
    bySource.get(key).push(r);
  }
  const rows = [];
  for (const [where, runs] of bySource) {
    const cuts = runs.filter(r => r.seconds).length;
    rows.push(`<tr><td colspan="7" style="padding-top:18px;border-bottom:0">
      <strong>${esc(where.split('/').pop())}</strong>
      <span class="why">　${esc(where)}　·　${runs.length} 輪${cuts ? `，${cuts} 支剪成` : ''}</span>
    </td></tr>`);
    for (const r of runs) rows.push(`<tr>
      <td class="mono">${new Date(r.started_at * 1000).toLocaleString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
      <td>${r.state === 'done' ? '' : `<span class="tag ${r.state === 'failed' ? 'no' : ''}">${
        ({running:'執行中',failed:'失敗',stopped:'已停止',interrupted:'中斷'})[r.state] || r.state}</span>`}</td>
      <td class="mono">${r.seconds ? r.seconds.toFixed(1) + 's' : '—'}</td>
      <td class="mono">${r.shots || '—'}</td>
      <td class="mono">${r.delivered != null ? r.delivered + '/' + r.shots : '—'}</td>
      <td class="mono">${r.spend != null ? '$' + r.spend.toFixed(2) : '—'}</td>
      <td><a class="shot" href="#" onclick="openRun('${r.run_id}');return false">打開</a></td>
    </tr>`);
  }
  $('past-table').innerHTML =
    '<tr><th>時間</th><th></th><th>片長</th><th>顆數</th><th>逐顆通過</th><th>花費</th><th></th></tr>'
    + rows.join('');
  $('detail').classList.remove('hide');
  // Nothing open yet: the useful thing on a cold page is what was cut before,
  // and the tabs that need a run have nothing in them.
  if (!runId) {
    for (const id of ['pane-shots', 'pane-tx', 'pane-spend', 'pane-aside']) {
      $(id).previousElementSibling; // keep the panes, hide their tabs
      document.querySelector(`.tab[data-pane="${id}"]`).classList.add('hide');
    }
    showTab('pane-past');
  }
}

async function openRun(id) {
  runId = id; seen = 0;
  const data = await (await fetch(`/api/runs/${id}`)).json();
  $('log').textContent = data.lines.join('\n');
  allLines = data.lines;
  $('progress').classList.remove('hide');
  $('state').textContent = { running:'執行中', done:'完成', failed:'失敗', stopped:'已停止', interrupted:'中斷' }[data.state] || data.state;
  if (data.has_video) {
    $('video').src = `/api/runs/${id}/video`;
    $('download').href = `/api/runs/${id}/deliverable`;
    $('result').classList.remove('hide');
  }
  $('state').textContent = { running:'執行中', done:'完成', failed:'失敗', stopped:'已停止', interrupted:'中斷' }[data.state] || data.state;
  paintSteps(allLines);
  if (data.state !== 'done' && data.state !== 'running') {
    showFault(allLines);
    $('resume').classList.remove('hide');
  }
  if (data.report) {
    for (const t of document.querySelectorAll('.tab')) t.classList.remove('hide');
    render(data.report); showExtras(); showTab('pane-shots');
  }
  window.scrollTo({ top: $('progress').offsetTop - 20, behavior: 'smooth' });
}

let blocks = [], blocksWere = [], picked = -1, lastReport = null;

// One shot at a time, where the eye already is. The whole table is still
// under 全部鏡頭 for reading straight through; this is for the shot you just
// clicked, which is the question anyone actually has in front of a cut.
function inspect(i) {
  const b = blocks[i];
  if (!b || !lastReport) { $('inspector').innerHTML = ''; return; }
  const plan = (lastReport.selection?.shots || [])[b.index] || {};
  const rhythm = (lastReport.rhythm || {})[`k${String(b.index).padStart(2, '0')}`] || {};
  const said = (lastReport.shots || {})[`k${String(b.index).padStart(2, '0')}`] || {};
  const deg = (lastReport.degradations || []).filter(
    d => d.clip_id === `k${String(b.index).padStart(2, '0')}`);
  const moved = Math.abs(b.in_seconds - (plan.start_seconds ?? b.in_seconds)) > 0.01
    || Math.abs(b.seconds - (rhythm.seconds ?? b.seconds)) > 0.01;

  $('inspector').innerHTML = `
    <div class="ins-head">
      <span class="mono">${esc(b.source_id)}</span>
      ${said.delivered === undefined ? '' :
        `<span class="tag ${said.delivered ? 'ok' : 'no'}">${
          said.delivered ? '做到宣告的事' : '沒做到宣告的事'}</span>`}
    </div>
    <a class="link" href="/api/runs/${runId}/shot/${b.index}" target="_blank">單獨看這一顆</a>
    ${said.delivered === false ? `<div class="why" style="margin-top:6px">
      「沒做到」的意思是：逐顆驗收單獨看了這一顆，認為它沒有做到下面那句宣告。
      不是畫面壞掉，是計畫跟結果對不起來。</div>` : ''}
    <dl>
      <dt>進出點</dt><dd class="mono">${b.in_seconds.toFixed(2)}s → ${(b.in_seconds + b.seconds).toFixed(2)}s
        （${b.seconds.toFixed(2)}s${moved ? '，已改動' : ''}）</dd>
      <dt>運鏡</dt><dd>${esc(plan.camera_move || '—')}${plan.framing ? `　<span class="why">${esc(plan.framing)}</span>` : ''}</dd>
      <dt>主體</dt><dd>${esc(plan.subject || '—')}${said.speaker ? `<div class="why">說話：${esc(said.speaker)}</div>` : ''}</dd>
      <dt>它宣告要做什麼</dt><dd class="why">${esc(plan.why || '—')}</dd>
      ${rhythm.why ? `<dt>為什麼這個長度</dt><dd class="why">${esc(rhythm.why)}</dd>` : ''}
      ${said.note ? `<dt>驗收實際看到</dt><dd class="why">${esc(said.note)}</dd>` : ''}
      ${deg.length ? `<dt>做不到的地方</dt><dd>${deg.map(tellDegradation).join('')}</dd>` : ''}
    </dl>`;
}

async function showStrip() {
  const data = await (await fetch(`/api/runs/${runId}/timeline-data`)).json();
  if (!data.blocks.length) return;
  blocks = data.blocks.map((b, i) => ({ ...b, index: i }));
  blocksWere = JSON.parse(JSON.stringify(blocks));
  paintStrip();
  $('strip').classList.remove('hide');
  if (blocks.length) { picked = 0; paintStrip(); inspect(0); paintWaves(
    blocks.reduce((a, b) => a + b.seconds, 0) || 1); }
  // Clicking anywhere on the reel is a seek, which is what a timeline is for.
  $('reel').onclick = (e) => {
    if (e.target.closest('.blk')) return;
    const box = $('reel').getBoundingClientRect();
    const total = blocks.reduce((a, b) => a + b.seconds, 0) || 1;
    $('video').currentTime = ((e.clientX - box.left) / box.width) * total;
  };
}

// Pixels per second. Everything on the reel is positioned from this, so the
// tracks line up with each other and with the clock -- a strip laid out by
// proportion cannot.
let scale = 24;

function reelSeconds() {
  return blocks.reduce((a, b) => a + b.seconds, 0) || 1;
}

function fitScale() {
  const room = ($('scroller').clientWidth || 900) - 2;
  scale = Math.max(4, room / reelSeconds());
  $('zoom').value = Math.min(120, Math.max(6, scale));
}

function clock(seconds) {
  const m = (seconds / 60) | 0, s = seconds % 60;
  return `${m}:${String(s | 0).padStart(2, '0')}`;
}

function paintRuler(total) {
  const step = [0.5, 1, 2, 5, 10, 15, 30, 60].find(n => n * scale >= 58) || 60;
  const marks = [];
  for (let at = 0; at <= total + 0.001; at += step) {
    marks.push(`<i style="left:${at * scale}px"></i>`
      + `<span style="left:${at * scale}px">${
        at >= 60 ? clock(at) : `${+at.toFixed(1)}s`}</span>`);
  }
  $('ruler').innerHTML = marks.join('');
  $('reel').style.width = `${total * scale}px`;
}

function paintWaves(total) {
  const width = Math.max(600, Math.min(6000, Math.round(total * scale * 2)));
  for (const which of ['voice', 'music']) {
    const lane = $(`lane-${which}`);
    const img = new Image();
    img.onload = () => {
      lane.classList.remove('silent');
      lane.innerHTML = `<span class="name">${which === 'voice' ? '人聲' : '音樂'}</span>`;
      lane.appendChild(img);
    };
    img.onerror = () => {
      lane.classList.add('silent');
      lane.innerHTML = which === 'voice' ? '這支片沒有保留原音' : '這支片沒有配樂';
    };
    img.src = `/api/runs/${runId}/waveform/${which}?width=${width}`;
  }
}

function paintStrip() {
  const total = reelSeconds();
  paintRuler(total);
  let at = 0;
  $('track').innerHTML = blocks.map((b, i) => {
    const left = at * scale; at += b.seconds;
    return `
    <div class="blk ${b.delivered === false ? 'no' : ''} ${i === picked ? 'on' : ''}"
         style="left:${left}px;width:${b.seconds * scale - 2}px" data-i="${i}" draggable="true"
         title="${esc(b.source_id)}　${esc(b.subject)}">
      <div class="grip l" data-edge="l" data-i="${i}"></div>
      <div class="lab">${esc(b.source_id)}</div>
      <div class="dur">${b.seconds.toFixed(1)}s</div>
      <div class="kill" data-kill="${i}">×</div>
      <div class="grip r" data-edge="r" data-i="${i}"></div>
    </div>`;
  }).join('');
  wireStrip();
  const changed = JSON.stringify(blocks) !== JSON.stringify(blocksWere);
  $('recut').classList.toggle('hide', !changed);
  $('strip-note').textContent = changed
    ? `${blocks.length} 顆，共 ${total.toFixed(1)}s——按「重新輸出」套用（不用錢）`
    : '拖邊緣改進出點，拖方塊換順序，× 刪掉';
  movePlayhead();
}

function wireStrip() {
  let from = -1;
  for (const el of $('track').querySelectorAll('.blk')) {
    const i = +el.dataset.i;
    el.onclick = (e) => {
      if (e.target.dataset.kill !== undefined || e.target.classList.contains('grip')) return;
      picked = i; paintStrip(); inspect(i);
      if (peeking) peek(true);
      const at = blocks.slice(0, i).reduce((a, b) => a + b.seconds, 0);
      $('video').currentTime = at + 0.05;
    };
    el.ondragstart = () => { from = i; };
    el.ondragover = (e) => e.preventDefault();
    el.ondrop = () => {
      if (from < 0 || from === i) return;
      const [moved] = blocks.splice(from, 1);
      blocks.splice(i, 0, moved);
      from = -1; picked = -1; paintStrip();
    };
  }
  for (const el of $('track').querySelectorAll('[data-kill]')) {
    el.onclick = (e) => {
      e.stopPropagation();
      blocks.splice(+el.dataset.kill, 1);
      picked = -1; paintStrip();
    };
  }
  for (const grip of $('track').querySelectorAll('.grip')) {
    grip.onmousedown = (e) => {
      e.preventDefault(); e.stopPropagation();
      const i = +grip.dataset.i, edge = grip.dataset.edge;
      const b = blocks[i], startX = e.clientX;
      const was = { in: b.in_seconds, sec: b.seconds };
      const perPx = 1 / scale;
      const move = (ev) => {
        const d = (ev.clientX - startX) * perPx;
        if (edge === 'l') {
          // Pulling the head earlier eats into the handle; the shot keeps
          // its out-point, so it gets longer rather than sliding.
          const shift = Math.max(-was.in, Math.min(d, was.sec - 0.3));
          b.in_seconds = +(was.in + shift).toFixed(3);
          b.seconds = +(was.sec - shift).toFixed(3);
        } else {
          const room = b.source_seconds ? b.source_seconds - b.in_seconds : 99;
          b.seconds = +Math.max(0.3, Math.min(was.sec + d, room)).toFixed(3);
        }
        paintStrip();
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    };
  }
}

$('undo-cut').addEventListener('click', () => {
  blocks = JSON.parse(JSON.stringify(blocksWere)); picked = -1; paintStrip();
});

$('recut').addEventListener('click', async () => {
  $('recut').disabled = true;
  $('strip-note').textContent = '重新輸出中…';
  const res = await fetch(`/api/runs/${runId}/recut`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ shots: blocks.map(b => ({
      index: b.index, in_seconds: b.in_seconds, seconds: b.seconds })) }),
  });
  $('recut').disabled = false;
  if (!res.ok) { $('strip-note').textContent = '失敗：' + (await res.text()).slice(0, 120); return; }
  const out = await res.json();
  $('video').src = `/api/runs/${runId}/video?t=` + Date.now();
  blocksWere = JSON.parse(JSON.stringify(blocks));
  $('strip-note').textContent = `已重新輸出：${out.shots} 顆、${out.seconds.toFixed(1)}s`;
  $('recut').classList.add('hide');
});

// Follow the playhead so the strip says where you are.
document.addEventListener('DOMContentLoaded', () => {
  $('video').addEventListener('timeupdate', () => {
    if (!blocks.length) return;
    const total = blocks.reduce((a, b) => a + b.seconds, 0) || 1;
    $('playhead').style.left = `${($('video').currentTime / total) * 100}%`;
    let at = 0, now = -1;
    blocks.forEach((b, i) => {
      if ($('video').currentTime >= at) now = i;
      at += b.seconds;
    });
    if (now !== picked) {
      picked = now; paintStrip(); inspect(now);
      if (peeking) peek(true);
    }
  });
  addEventListener('resize', () => { if (blocks.length) paintStrip(); });
});

async function showTranscripts() {
  const data = await (await fetch(`/api/runs/${runId}/transcripts`)).json();
  const rows = [];
  for (const [source, card] of Object.entries(data.sources)) {
    rows.push(`<tr><td colspan="4" style="padding-top:16px"><strong>${esc(source)}</strong>
      <span class="why">　${esc(card.language || '')}　${esc(card.summary)}</span></td></tr>`);
    for (const l of card.lines) rows.push(`<tr>
      <td class="mono">${l.starts_seconds.toFixed(1)}–${l.ends_seconds.toFixed(1)}s</td>
      <td class="why">${esc(l.speaker)}</td>
      <td>${esc(l.text)}</td>
      <td class="why">${l.corrected ? '聽成：' + esc(l.heard) : ''}</td></tr>`);
  }
  $('tx-table').innerHTML = '<tr><th>時間</th><th>誰</th><th>說了什麼</th><th>原始辨識</th></tr>'
    + (rows.length ? rows.join('')
       : emptyRow(4, '這一輪沒有做逐字稿——素材裡的聲音不是內容，或關掉了語音。'));
  $('detail').classList.remove('hide');
}

function showExtras() {
  for (const [id, flavour] of [['tl-pr','premiere'], ['tl-fc','finalcut']]) {
    fetch(`/api/runs/${runId}/timeline/${flavour}`, { method: 'HEAD' })
      .then(r => { if (r.ok) {
        $(id).href = `/api/runs/${runId}/timeline/${flavour}`;
        $(id).classList.remove('hide');
      }});
  }
  fetch(`/api/runs/${runId}/subtitles`, { method: 'HEAD' }).then(r => {
    if (r.ok) { $('subs').href = `/api/runs/${runId}/subtitles`; $('subs').classList.remove('hide'); }
  });
  showTranscripts();
  showStrip();
}

loadPast();

$('rushes').addEventListener('change', () => {
  const files = [...$('rushes').files].filter(f => /\.(mp4|mov|m4v|avi|mkv)$/i.test(f.name));
  $('picked').textContent = files.length ? `${files.length} 支影片` : '沒有找到影片檔';
});

$('go').addEventListener('click', async () => {
  const files = [...$('rushes').files].filter(f => /\.(mp4|mov|m4v|avi|mkv)$/i.test(f.name));
  const path = $('path').value.trim();
  if (!path && !files.length) { alert('給一個素材路徑，或改用上傳'); return; }
  const body = new FormData();
  files.forEach(f => body.append('rushes', f, f.name));
  body.append('source_path', path);
  body.append('music_path', $('music-path').value.trim());
  body.append('speech', $('speech').value);
  body.append('locale', $('locale').value.trim());
  body.append('brief', $('brief').value);
  body.append('aspect', $('aspect').value);
  body.append('budget', $('budget').value);
  body.append('review', $('review').checked ? 'true' : 'false');
  body.append('timeline', $('timeline').value);

  $('go').disabled = true;
  $('veil').classList.remove('hide');
  $('progress').classList.remove('hide');
  $('log').textContent = '準備中…\n';
  const res = await fetch('/api/runs', { method: 'POST', body });
  if (!res.ok) {
    $('log').textContent = '啟動失敗：' + (await res.text());
    $('go').disabled = false; return;
  }
  runId = (await res.json()).run_id;
  seen = 0; allLines = []; stepWas = -1; $('log').textContent = '';
  // Whatever is on screen belongs to the last run. Leaving it there while a
  // new one writes cards reads as though the new one already finished.
  for (const id of ['result', 'detail', 'fault']) $(id).classList.add('hide');
  for (const pane of ['pane-tx', 'pane-aside']) {
    $(pane).classList.add('hide');
  }
  for (const id of ['subs', 'tl-pr', 'tl-fc']) $(id).classList.add('hide');
  $('video').removeAttribute('src');
  timer = setInterval(poll, 1200);
  ticker = setInterval(() => { if (allLines.length) paintSteps(allLines); }, 1000);
  poll();
});

// What each stage is for, in the order it happens. The raw output says
// "cards: 74 written"; this says what that was and why it took four minutes.
const STEPS = [
  ['proxy',      '準備素材',   '每支壓一份小檔給模型看，順便把已經剪過的長片照場景切點拆開',
                 l => /clips (from|in) /.test(l)],
  ['cards',      '看每一支素材', 'Gemini 連聲音一起看完，記下內容、可框住的東西在哪、動作在第幾秒、聲音是不是內容',
                 l => /^\s*card \d+\/|^cards:/.test(l)],
  ['speech',     '聽懂在講什麼', 'Apple 辨識器給逐字時間，Gemini 改錯字並標出誰在講',
                 l => /^speech:|transcribed/.test(l)],
  ['direction',  '決定剪成什麼', '調性、長度、比例、音樂怎麼鋪',
                 l => /^direction:/.test(l)],
  ['selection',  '挑鏡頭',     '用哪幾顆、從第幾秒進、多長、什麼運鏡、框住誰',
                 l => /^selection:|^cut on action/.test(l)],
  ['subject',    '找主體與裁切', 'Gemini 指出是哪一個，SAM 逐幀追出在哪裡，算出裁切路徑',
                 l => /^no music map|^\s*subject \d+\/|frame loading|propagate/.test(l)],
  ['review',     '驗收',       '先逐顆對照它自己的計畫，再看整支',
                 l => /^shots:|^review \d/.test(l)],
  ['replan',     '重新規劃',    '沒做到的那幾顆換個做法，其他不動',
                 l => /^\s*replan /.test(l)],
  ['done',       '完成',       '影片、報表、以及你要的時間軸',
                 l => /^deliverable/.test(l)],
];

let stepSince = 0, stepWas = -1;

function since(seconds) {
  if (seconds < 60) return `${seconds | 0} 秒`;
  return `${(seconds / 60) | 0} 分 ${(seconds % 60) | 0} 秒`;
}

function paintSteps(lines) {
  let reached = -1;
  const notes = {};
  lines.forEach(line => {
    STEPS.forEach(([key, , , matches], i) => {
      if (!matches(line)) return;
      if (i > reached) reached = i;
      notes[key] = line.trim();
    });
  });
  const label = $('state').textContent;
  const running = label === '執行中';
  const broke = label === '失敗' || label === '中斷';
  $('steps').innerHTML = STEPS.map(([key, name, said], i) => {
    const state = i < reached ? 'done'
      : i === reached ? (running ? 'now' : broke ? 'broke' : 'done')
      : 'todo';
    let note = notes[key] && state !== 'todo'
      ? `<div class="said mono" style="color:var(--dim)">${esc(notes[key])}</div>` : '';
    if (state === 'now') {
      if (i !== stepWas) { stepWas = i; stepSince = Date.now(); }
      note += `<div class="why">已經 ${since((Date.now() - stepSince) / 1000)}`
        + `——這一步大多在等 Gemini 回應，CPU 沒有動是正常的</div>`;
    }
    return `<li class="${state}">
      <span class="mark">${state === 'done' ? '✓' : ''}</span>
      <div><div class="name">${name}</div><div class="said">${said}</div>${note}</div>
    </li>`;
  }).join('');
}

// A failure buried in a collapsed panel is a failure nobody sees. Pull out
// the line that says what went wrong and put it where the eye already is.
const FAULTS = [
  [/exceeded its monthly spending cap/,
   'Google 專案的月度支出上限滿了',
   '這不是這裡設的 --budget，是 AI Studio 的專案設定。到 <a href="https://ai.studio/spend" target="_blank">ai.studio/spend</a> 調高額度，然後按上面的「繼續跑」——卡片、逐字稿、定調、選片都已經存起來了，不會重付。'],
  [/RESOURCE_EXHAUSTED|429/,
   'Gemini 拒絕了請求（429）',
   '通常是額度或速率限制。等一下再試，或看下面的原始輸出。'],
  [/CardLibraryEmpty/,
   '每一支素材都寫不出卡片',
   '通常是環境問題不是素材問題——API key、網路、或 ffmpeg。原始輸出裡有第一筆失敗的真正原因。'],
  [/is not there/,
   '給的路徑不存在',
   '從 Finder 拖進來的路徑會帶 file:// 前綴，用「瀏覽」選比較保險。'],
  [/BudgetSpent|budget spent/,
   '碰到你設的預算上限',
   '已經完成的部分還在，把上限調高再跑一次就會接下去。'],
];

function showFault(lines) {
  for (const line of lines.slice().reverse()) {
    for (const [pattern, what, why] of FAULTS) {
      if (pattern.test(line)) {
        $('fault').innerHTML = `<b>${what}</b><div>${why}</div>`;
        $('fault').classList.remove('hide');
        return;
      }
    }
  }
  const last = lines.filter(l => /Error|Traceback|refused/i.test(l)).pop();
  if (last) {
    $('fault').innerHTML =
      `<b>這一輪沒有跑完</b><div class="detail">${esc(last.slice(0, 200))}</div>`;
    $('fault').classList.remove('hide');
  }
}

function classify(line) {
  if (/^\s+(card|subject|replan) \d*\/?/.test(line)) return 'faint';
  if (/error|Traceback|failed|refused/i.test(line)) return 'bad';
  if (/^(cards|direction|selection|shots|review|replan|cut on action|set aside|no music map)/.test(line)) return 'stage';
  if (/delivered what they planned/.test(line)) return 'good';
  return '';
}

async function poll() {
  const res = await fetch(`/api/runs/${runId}?since=${seen}`);
  const data = await res.json();
  for (const line of data.lines) {
    const span = document.createElement('span');
    span.className = classify(line);
    span.textContent = line + '\n';
    $('log').appendChild(span);
  }
  seen = data.total_lines;
  $('log').scrollTop = $('log').scrollHeight;
  $('state').textContent = { running: '執行中', done: '完成', failed: '失敗', stopped: '已停止' }[data.state];
  $('state').className = 'state' + (data.state === 'done' ? ' done' : '');
  allLines = allLines.concat(data.lines);
  paintSteps(allLines);
  if (data.state === 'failed' || data.state === 'stopped') {
    showFault(allLines);
    $('raw').open = true;
    $('resume').classList.remove('hide');
  }

  if (data.state !== 'running') {
    clearInterval(timer); clearInterval(ticker); $('go').disabled = false;
    if (data.has_video) {
      $('video').src = `/api/runs/${runId}/video`;
      $('download').href = `/api/runs/${runId}/deliverable`;
      showExtras();
      $('result').classList.remove('hide');
    }
    if (data.report) {
      for (const t of document.querySelectorAll('.tab')) t.classList.remove('hide');
      render(data.report); showTab('pane-shots');
    }
    loadPast();
  }
}

// The report names these for the code that raises them. On screen they have
// to say what happened, and carry the number that forced it -- that number is
// the whole reason a degradation is worth recording rather than hiding.
const LADDERS = {
  static_on_subject: ['主體沒有在動，所以定住', '本來計畫跟拍，但量到的主體幾乎沒有位移'],
  reduced_zoom: ['推近沒有推到底', '再推下去要把畫面放大到會糊'],
  slower_follow: ['跟拍放慢了', '照原本的速度會超過這一段的運鏡上限'],
  center_crop: ['框在正中間', '指定的主體沒有被定位到，所以沒有東西可以瞄準'],
  subject_wider_than_delivery: ['主體比畫面寬', '這個比例的任何裁切都框不下整個主體'],
  subject_larger_than_crop: ['主體塞不進裁切框', '整段裡沒有一刻框得下它'],
  tracking_lost_most_frames: ['追蹤掉了大半的幀', '剩下的幀不足以當成一段軌跡'],
  trim_window_clamped_to_source: ['要的長度超過素材本身', '素材沒有那麼長，剪到尾就停'],
  full_move: ['照原本的運鏡做完', ''],
};
// Who looked, and what they concluded. This used to be settled by the layer
// that watched the whole film and never saw the shot in question -- "the
// subject is 0.88 of frame wide and can show 36% of itself" is not judgeable
// from a thirty-second cut and a line of numbers.
const SETTLED = {
  accept: ['看過畫面：可以這樣交',
           '逐顆驗收單獨看了這一顆，認為雖然沒照原計畫做，畫面仍然成立'],
  replan: ['看過畫面：這顆要重做',
           '逐顆驗收認為畫面因此不成立，所以退回重新規劃'],
  unadjudicated: ['沒有人看過',
                  '這一輪沒跑到驗收——沒開自審，或提前停了'],
};

function tellDegradation(d) {
  const [what, why] = LADDERS[d.ladder] || [d.ladder, ''];
  const [verdict, meaning] = SETTLED[d.adjudication] || [d.adjudication || '', ''];
  const numbers = Object.entries(d.measured || {})
    .map(([k, v]) => `${k} ${typeof v === 'number' ? +v.toFixed(3) : v}`)
    .join('　');
  return `<div style="margin-bottom:7px">
    <div>${esc(what)}${verdict ? ` <span class="tag" title="${esc(meaning)}">${esc(verdict)}</span>` : ''}</div>
    ${why ? `<div class="why">${esc(why)}</div>` : ''}
    ${meaning ? `<div class="why">${esc(meaning)}</div>` : ''}
    ${numbers ? `<div class="why mono">${esc(numbers)}</div>` : ''}
  </div>`;
}

// An empty panel that shows only its subtitle reads as broken. Empty is
// usually an answer -- nothing was set aside, nobody spoke -- so it says so.
function emptyRow(cols, said) {
  return `<tr><td colspan="${cols}" class="why" style="padding:18px 11px;border-bottom:0">${esc(said)}</td></tr>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function render(report) {
  lastReport = report;
  const howMany = (report.selection?.shots || []).length;
  const [landed, wanted] = String(report.cuts_on_music ?? '0/0').split('/').map(Number);
  const degraded = (report.degradations || []).length;
  const spent = Object.values(report.spend?.by_stage || {}).reduce((a, b) => a + b, 0);
  const target = report.target_seconds;
  const off = target ? (report.duration_seconds ?? 0) - target : 0;

  const stats = [
    [`${(report.duration_seconds ?? 0).toFixed(1)}s`,
     target ? `目標 ${target}s，${off < 0 ? '短' : '長'} ${Math.abs(off).toFixed(1)}s` : '片長'],
    [howMany, '顆鏡頭'],
    // "0/13" read as though every cut had missed. A film where nothing asked
    // for a beat is not a film that missed every beat.
    wanted ? [`${landed}/${wanted}`, '刀切在音樂事件上']
           : [howMany, '刀的長度由內容決定'],
    [degraded, degraded ? '處做不到原本的計畫，都記了原因' : '處沒做到計畫'],
    ['$' + spent.toFixed(2), '本輪花費'],
  ];
  $('stats').innerHTML = stats.map(([v, s]) =>
    `<div class="stat"><b>${esc(String(v))}</b><span>${esc(s)}</span></div>`).join('');

  // The report nests these under by_stage alongside the cap and the running
  // total; iterating the outer object showed one row called "by_stage".
  const spend = Object.entries(report.spend?.by_stage || {})
    .sort((a, b) => b[1] - a[1]);
  const total = spend.reduce((a, [, v]) => a + v, 0);
  $('spend').innerHTML = '<tr><th>階段</th><th style="text-align:right">花費</th></tr>' +
    spend.map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td class="mono" style="text-align:right">$${v.toFixed(4)}</td></tr>`).join('') +
    `<tr><td class="why">合計</td><td class="mono" style="text-align:right">$${total.toFixed(4)}</td></tr>`;

  const shots = report.selection?.shots || [];
  const rhythm = report.rhythm || {}, verdicts = report.shots || {};
  const degByClip = {};
  for (const d of report.degradations || []) (degByClip[d.clip_id] ||= []).push(d);

  $('shot-table').innerHTML =
    '<colgroup><col style="width:34px"><col style="width:130px"><col style="width:104px">' +
    '<col style="width:88px"><col style="width:170px"><col><col style="width:150px">' +
    '<col style="width:170px"></colgroup>' +
    '<tr><th>#</th><th>素材</th><th>進點／長度</th><th>運鏡</th><th>主體／說話者</th>' +
    '<th>為什麼用這顆</th><th>做不到的地方</th><th>逐顆驗收</th></tr>' +
    shots.map((s, i) => {
      const k = 'k' + String(i).padStart(2, '0');
      const r = rhythm[k] || {}, v = verdicts[k] || {};
      const deg = (degByClip[k] || []).map(tellDegradation).join('');
      const ok = v.delivered === undefined ? '' :
        `<span class="tag ${v.delivered ? 'ok' : 'no'}">${
          v.delivered ? '做到' : '沒做到'}</span>`;
      return `<tr>
        <td class="mono">${i}</td>
        <td class="mono" style="word-break:break-all"><a class="shot" href="/api/runs/${runId}/shot/${i}" target="_blank">${esc(s.source_id)}</a></td>
        <td class="mono num">${Number(s.start_seconds ?? 0).toFixed(1)}s<br>${Number(r.seconds ?? 0).toFixed(2)}s</td>
        <td>${esc(s.camera_move)}${s.framing ? `<div class="why">${esc(s.framing)}</div>` : ''}</td>
        <td>${esc(s.subject)}${s.must_be_whole ? '<div class="why">要完整</div>' : ''}${v.speaker ? `<div class="why">說話：${esc(v.speaker)}</div>` : ''}</td>
        <td class="why">${esc(s.why)}${r.why ? `<div style="margin-top:5px">節奏：${esc(r.why)}</div>` : ''}</td>
        <td>${deg || '<span class="why">—</span>'}</td>
        <td>${ok}${v.note ? `<div class="why">${esc(v.note)}</div>` : ''}</td>
      </tr>`;
    }).join('');
  $('detail').classList.remove('hide');

  // Three different ways a clip does not reach the film, and only the
  // rarest of them was on screen -- so a run that ruled out three takes and
  // passed over sixty more said "every clip was usable".
  const rows = [];
  for (const [name, why] of Object.entries(report.set_aside || {})) {
    rows.push([name, '卡片判定不能用', why]);
  }
  for (const entry of report.direction?.unusable || []) {
    rows.push([
      entry.source_id, '定調排除',
      entry.reason + (entry.superseded_by ? `（由 ${entry.superseded_by} 取代）` : ''),
    ]);
  }
  const spoken = new Set(rows.map(r => r[0]));
  const used = new Set((report.selection?.shots || []).map(s => s.source_id));
  for (const name of (report.material_ids || [])) {
    if (!used.has(name) && !spoken.has(name)) {
      rows.push([name, '選片沒挑', '可以用，但這一支片沒有它的位置']);
    }
  }
  $('aside-table').innerHTML =
    '<tr><th>檔名</th><th>怎麼沒用到</th><th>理由</th></tr>'
    + (rows.length
       ? rows.map(([name, how, why]) => `<tr>
           <td class="mono">${esc(name)}</td>
           <td><span class="tag">${esc(how)}</span></td>
           <td class="why">${esc(why)}</td></tr>`).join('')
       : emptyRow(3, '每一支素材都用上了。'));
}

// --- verifying the crop and the follow ---------------------------------
// A report saying "push_in on (0.507, 0.484)" is a claim. Playing the take
// underneath with the box drawn on it is the claim being checked, which is
// what this whole tool is for.
let peeking = false;

function cropAt(block, seconds) {
  const keys = block.crop || [];
  if (!keys.length) return null;
  if (keys.length === 1) return keys[0];
  const t = Math.max(0, Math.min(seconds, keys[keys.length - 1].at));
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i].at) {
      const a = keys[i - 1], b = keys[i];
      const span = (b.at - a.at) || 1;
      // The render eases between these; a straight line here is close enough
      // to show where the frame is, and is honest about being an indication.
      const p = (t - a.at) / span;
      return {
        x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p,
        w: a.w + (b.w - a.w) * p, h: a.h + (b.h - a.h) * p,
      };
    }
  }
  return keys[keys.length - 1];
}

function drawCrop() {
  const b = blocks[picked];
  if (!peeking || !b) { $('cropbox').classList.add('hide'); return; }
  const raw = $('raw-video');
  const box = cropAt(b, raw.currentTime - b.in_seconds);
  if (!box || !raw.videoWidth) { $('cropbox').classList.add('hide'); return; }
  const shown = raw.getBoundingClientRect();
  const holder = $('frame').getBoundingClientRect();
  const el = $('cropbox');
  el.classList.remove('hide');
  el.style.left = `${shown.left - holder.left + box.x * shown.width}px`;
  el.style.top = `${shown.top - holder.top + box.y * shown.height}px`;
  el.style.width = `${box.w * shown.width}px`;
  el.style.height = `${box.h * shown.height}px`;
  el.dataset.say = `${(b.crop || []).length > 1 ? '跟拍中' : '定住'}　`
    + `${Math.round(box.w * 100)}% 寬`;
}

function peek(on) {
  peeking = on;
  $('see-cut').classList.toggle('on', !on);
  $('see-raw').classList.toggle('on', on);
  $('video').classList.toggle('hide', on);
  $('raw-video').classList.toggle('hide', !on);
  if (!on) { $('cropbox').classList.add('hide'); return; }
  const b = blocks[picked];
  if (!b) return;
  const raw = $('raw-video');
  const want = `/api/runs/${runId}/source/${b.index}`;
  if (raw.getAttribute('src') !== want) {
    raw.setAttribute('src', want);
    raw.load();
  } else if (raw.readyState) {
    raw.currentTime = b.in_seconds;
  }
  drawCrop();
}

$('see-cut').addEventListener('click', () => peek(false));
$('see-raw').addEventListener('click', () => peek(true));
$('raw-video').addEventListener('timeupdate', drawCrop);
for (const when of ['loadedmetadata', 'loadeddata', 'seeked', 'canplay']) {
  $('raw-video').addEventListener(when, () => {
    const b = blocks[picked];
    if (when === 'loadedmetadata' && b) $('raw-video').currentTime = b.in_seconds;
    drawCrop();
  });
}
addEventListener('resize', drawCrop);
</script>
</body>
</html>
